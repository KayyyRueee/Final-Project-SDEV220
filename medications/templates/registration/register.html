<!DOCTYPE html>
<html>
<head>
    <title>Sign Up for MedCheck</title>
</head>

<body>

<h2>Register</h2>

{% if error %}
  <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <p>Company Code:<input type="text" name="company_code" placeholder="Try: MED2026"required></p>

    <button type="submit">Sign up</button>
</form>

</body>
</html>
